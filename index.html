<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/og-financial-favicon-v2.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/og-financial-apple-v2.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#3F713E" />
    <title>OG Financial Services - Quick Loans for Namibians</title>
    <meta
      name="description"
      content="Apply online with OG Financial Services, a NAMFISA-registered microlender serving Namibians with transparent personal lending."
    />
    <meta name="author" content="OG Financial Services CC" />

    <meta property="og:title" content="OG Financial Services - Quick Loans for Namibians" />
    <meta
      property="og:description"
      content="Apply online for transparent personal lending from a NAMFISA-registered Namibian microlender."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://namlend-trust-portal-v220.netlify.app/og-financial-social-v2.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OG Financial Services - Quick Loans for Namibians" />
    <meta
      name="twitter:description"
      content="Apply online for transparent personal lending from a NAMFISA-registered Namibian microlender."
    />
    <meta
      name="twitter:image"
      content="https://namlend-trust-portal-v220.netlify.app/og-financial-social-v2.png"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      html {
        scroll-behavior: smooth;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      /* Landing page animations */
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-15px) rotate(2deg);
        }
      }
      @keyframes aurora {
        0% {
          transform: rotate(0deg) scale(1);
        }
        50% {
          transform: rotate(180deg) scale(1.1);
        }
        100% {
          transform: rotate(360deg) scale(1);
        }
      }
      @keyframes fadeInUp {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes shine {
        100% {
          left: 125%;
        }
      }
      @keyframes progress {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(200%);
        }
      }

      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      .animate-aurora {
        animation: aurora 20s linear infinite;
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.8s ease-out forwards;
      }
      .animate-shine {
        animation: shine 2s infinite;
      }

      /* Initial loader styles */
      .loader-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f7faf6;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .loader-text {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 2rem;
        color: #274f35;
        margin-bottom: 1rem;
        letter-spacing: -0.05em;
      }
      .loader-bar {
        width: 200px;
        height: 4px;
        background: #e2e8f0;
        border-radius: 99px;
        overflow: hidden;
      }
      .loader-progress {
        width: 50%;
        height: 100%;
        background: #3f713e;
        animation: progress 1.5s ease-in-out infinite;
      }
    </style>
  </head>

  <body>
    <!-- Initial Loader (Disappears when React mounts) -->
    <div id="root">
      <div class="loader-container">
        <div class="loader-text">OG Financial Services</div>
        <div class="loader-bar">
          <div class="loader-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
