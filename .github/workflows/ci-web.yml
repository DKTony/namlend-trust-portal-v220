name: CI - Web

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript compiler
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          mkdir -p test-results
          npm run test:unit -- --reporter=json --outputFile=test-results/unit.json
        env:
          CI: true

      - name: Upload named unit-test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ontology-results-unit-${{ github.run_id }}
          path: test-results/unit.json
          retention-days: 14

  convex-tests:
    name: Convex Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Convex tests with named results
        run: |
          mkdir -p test-results
          npm run test:convex -- --reporter=json --outputFile=test-results/convex.json
        env:
          CI: true

      - name: Upload named Convex-test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ontology-results-convex-${{ github.run_id }}
          path: test-results/convex.json
          retention-days: 14

  production-build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  ontology:
    name: Ontology & Evidence Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compare semantic graph with pull-request base
        if: github.event_name == 'pull_request'
        run: npm run ontology:diff -- "$BASE_SHA" | tee ontology/graph-diff.txt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Reject ontology drift and unregistered skips
        run: npm run ontology:check

      - name: Enforce agent policy and Graphify boundary
        run: |
          npm run agent:policy
          npm run graphify:check
          npm run agent:eval

      - name: Run T1-T3 and T5-T6 ontology verification
        run: |
          mkdir -p test-results
          npm run ontology:test -- --reporter=json --outputFile=test-results/ontology.json

      - name: Upload ontology verification and semantic diff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ontology-results-contract-${{ github.run_id }}
          path: |
            test-results/ontology.json
            ontology/graph-diff.txt
          if-no-files-found: ignore
          retention-days: 14

  behavior-proof:
    name: Current-SHA Behaviour Proof
    runs-on: ubuntu-latest
    needs: [unit-tests, convex-tests, ontology]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download named unit and Convex results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ontology-results-*
          path: collected-results
          merge-multiple: true

      - name: Prove T4 behaviours from named passing current-SHA tests
        run: |
          mkdir -p test-results
          npm run ontology:prove-results -- --out test-results/ontology-execution-proof.json collected-results
          ONTOLOGY_REQUIRE_EXECUTION_PROOF=1 ONTOLOGY_EXECUTION_PROOF=test-results/ontology-execution-proof.json npm run ontology:test

      - name: Upload behaviour proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ontology-results-behaviour-${{ github.run_id }}
          path: test-results/ontology-execution-proof.json
          retention-days: 14

  playwright-api-smoke:
    name: Playwright API Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pull-request code receives no deployment key or test-account secret.
      # Mutating API execution is available only through the protected manual
      # job in e2e.yml; this required check validates deterministic discovery.
      - name: Validate API smoke-test discovery (secretless)
        env:
          VITE_CONVEX_URL: https://e2e-discovery.invalid
        run: npx playwright test e2e/api/ --project=chromium --list

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

  schema-type-check:
    name: Schema & Type Alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for legacy schema fields
        run: |
          echo "Checking for legacy fields: payment_date, next_payment_date..."
          if grep -r "payment_date\|next_payment_date" src/ --include="*.ts" --include="*.tsx" --exclude="*_broken.tsx" --exclude="types.ts" --exclude="supabase.ts"; then
            echo "❌ Found legacy schema fields in active code!"
            exit 1
          fi
          echo "✅ No legacy schema fields found in active code"

      - name: Verify Convex schema exists
        run: |
          echo "Checking convex/schema.ts exists..."
          test -f convex/schema.ts && echo "✅ Convex schema found" || { echo "❌ convex/schema.ts missing!"; exit 1; }

      - name: Check no new Supabase service imports
        run: |
          echo "Verifying no new legacy service imports..."
          LEGACY_COUNT=$(grep -rn "from '@/services/" src/ --include="*.ts" --include="*.tsx" | grep -v creditScoring | grep -v scoringRules | grep -v api-client | wc -l)
          if [ "$LEGACY_COUNT" -gt 0 ]; then
            echo "❌ Found $LEGACY_COUNT legacy service imports. Migrate to Convex."
            grep -rn "from '@/services/" src/ --include="*.ts" --include="*.tsx" | grep -v creditScoring | grep -v scoringRules | grep -v api-client
            exit 1
          fi
          echo "✅ No legacy service imports found"

  evidence-ledger:
    name: Current-SHA Evidence Ledger
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && !contains(needs.*.result, 'failure')
    needs:
      - lint-and-typecheck
      - unit-tests
      - convex-tests
      - production-build
      - ontology
      - behavior-proof
      - playwright-api-smoke
      - dependency-audit
      - schema-type-check
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download upstream named test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ontology-results-*
          path: collected-results
          merge-multiple: true

      - name: Resolve reviewed merge provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent-harness/risk-review.mjs --merge-receipt

      - name: Build current-SHA E1 ledger and semantic diff artifact
        run: |
          npm run ontology:ingest-results -- collected-results
          npm run agent:validate-merge -- ontology/ci-artifact/merge-receipt.json
        env:
          GITHUB_BASE_SHA: ${{ github.event.before }}
          UPSTREAM_RESULTS_JSON: ${{ toJson(needs) }}

      - name: Package the immutable assurance subject
        run: tar -czf "namlend-assurance-${GITHUB_SHA}.tgz" -C ontology/ci-artifact .

      - name: Upload assurance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: namlend-evidence-${{ github.run_id }}
          path: |
            ontology/ci-artifact/
            namlend-assurance-${{ github.sha }}.tgz
          retention-days: 30

      - name: Attest current-SHA assurance bundle
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: namlend-assurance-${{ github.sha }}.tgz
