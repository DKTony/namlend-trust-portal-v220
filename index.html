<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>NamLend - Quick Loans for Every Namibian | NAMFISA Licensed</title>
    <meta name="description" content="Get approved for personal loans in 5 minutes. NAMFISA licensed microlender serving banked and unbanked Namibians. Transparent terms, no hidden fees." />
    <meta name="author" content="NamLend Trust" />

    <meta property="og:title" content="NamLend - Quick Loans for Every Namibian" />
    <meta property="og:description" content="Get approved for personal loans in 5 minutes. NAMFISA licensed microlender serving Namibians." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@namlend" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      html { scroll-behavior: smooth; }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
      
      /* Landing page animations */
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-15px) rotate(2deg); }
      }
      @keyframes aurora {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.1); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes fadeInUp {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes shine {
        100% { left: 125%; }
      }
      @keyframes progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      
      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-aurora { animation: aurora 20s linear infinite; }
      .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
      .animate-shine { animation: shine 2s infinite; }
      
      /* Initial loader styles */
      .loader-container {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background-color: #f8fafc;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .dark .loader-container { background-color: #0a0a0a; }
      .loader-text {
        font-family: 'Space Grotesk', monospace;
        font-weight: 700;
        font-size: 2rem;
        color: #0f172a;
        margin-bottom: 1rem;
        letter-spacing: -0.05em;
      }
      .dark .loader-text { color: #f1f5f9; }
      .loader-bar {
        width: 200px;
        height: 4px;
        background: #e2e8f0;
        border-radius: 99px;
        overflow: hidden;
      }
      .dark .loader-bar { background: #27272a; }
      .loader-progress {
        width: 50%;
        height: 100%;
        background: #3b82f6;
        animation: progress 1.5s ease-in-out infinite;
      }
    </style>
  </head>

  <body>
    <!-- Initial Loader (Disappears when React mounts) -->
    <div id="root">
      <div class="loader-container">
        <div class="loader-text">NamLend</div>
        <div class="loader-bar">
          <div class="loader-progress"></div>
        </div>
      </div>
    </div>

    <!-- SVG Noise Filter for Glass Theme -->
    <svg style="display: none;">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.6" stitchTiles="stitch"/>
      </filter>
    </svg>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
