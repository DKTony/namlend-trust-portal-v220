name: E2E Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'convex/**'
      - 'e2e/**'
      - 'package.json'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 6:00 AM UTC (8:00 AM SAST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Filter tests by name (optional)'
        required: false
        type: string

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
  SUPABASE_PROJECT_ID: puahejtaskncpazjyxqp

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --force

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Validate backend configuration
        run: |
          if [ -z "$VITE_CONVEX_URL" ]; then
            echo "::error::Missing required secret: VITE_CONVEX_URL must be set in repo Settings → Secrets → Actions"
            exit 1
          fi
          echo "✅ VITE_CONVEX_URL is set"
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Checking Supabase connectivity (auth provider)..."
            curl --silent --fail --max-time 10 "${VITE_SUPABASE_URL}/rest/v1/" \
              -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
              -o /dev/null && echo "Supabase reachable ✓" || echo "::warning::Supabase not reachable — auth tests may fail"
          fi

      - name: Run Playwright tests
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
          E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE_URL: http://localhost:8080
          CI: true
        run: |
          if [ -n "${{ inputs.test_filter }}" ]; then
            npx playwright test --grep "${{ inputs.test_filter }}"
          else
            npx playwright test
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: test-results
          retention-days: 7
