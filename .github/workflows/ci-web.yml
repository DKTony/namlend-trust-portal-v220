name: CI - Web

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'convex/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/ci-web.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'convex/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - 'playwright.config.ts'
      - '.github/workflows/ci-web.yml'

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --force
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --force
      
      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true

  playwright-api-smoke:
    name: Playwright API Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --force
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run API smoke tests
        run: npx playwright test e2e/api/ --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_E2E: 'true'
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 7

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --force
      
      - name: Run npm audit
        run: npm audit --production --audit-level=high
        continue-on-error: true

  playwright-full-e2e:
    name: Full E2E Test Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --force
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Start dev server and run full E2E suite
        run: npx playwright test --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_E2E: 'true'
      
      - name: Upload full E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 14

  schema-type-check:
    name: Schema & Type Alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --force
      
      - name: Check for legacy schema fields
        run: |
          echo "Checking for legacy fields: payment_date, next_payment_date..."
          if grep -r "payment_date\|next_payment_date" src/ --include="*.ts" --include="*.tsx" --exclude="*_broken.tsx" --exclude="types.ts"; then
            echo "❌ Found legacy schema fields in active code!"
            exit 1
          fi
          echo "✅ No legacy schema fields found in active code"

      - name: Verify Convex schema exists
        run: |
          echo "Checking convex/schema.ts exists..."
          test -f convex/schema.ts && echo "✅ Convex schema found" || { echo "❌ convex/schema.ts missing!"; exit 1; }

      - name: Check no new Supabase service imports
        run: |
          echo "Verifying no new legacy service imports..."
          LEGACY_COUNT=$(grep -rn "from '@/services/" src/ --include="*.ts" --include="*.tsx" | grep -v brandingService | grep -v creditScoring | grep -v scoringRules | grep -v api-client | wc -l)
          if [ "$LEGACY_COUNT" -gt 0 ]; then
            echo "❌ Found $LEGACY_COUNT legacy service imports. Migrate to Convex."
            grep -rn "from '@/services/" src/ --include="*.ts" --include="*.tsx" | grep -v brandingService | grep -v creditScoring | grep -v scoringRules | grep -v api-client
            exit 1
          fi
          echo "✅ No legacy service imports found"
