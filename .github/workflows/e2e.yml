name: E2E Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Filter tests by name (optional)'
        required: false
        type: string

jobs:
  e2e:
    name: e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Playwright discovery without credentials or mutations
        env:
          VITE_CONVEX_URL: https://e2e-discovery.invalid
        run: npx playwright test --project=chromium --list

  e2e-trusted:
    name: Full E2E (protected disposable preview)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Configure this environment with required reviewers and a Convex Preview
    # Deploy Key. Pull-request jobs never enter it or receive its secret.
    environment: e2e-protected

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Validate protected preview deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          test -n "$CONVEX_DEPLOY_KEY" || {
            echo "::error::The protected Convex preview deploy key is not configured."
            exit 1
          }
          case "$CONVEX_DEPLOY_KEY" in
            preview:*:*'|'*) ;;
            *)
              echo "::error::CONVEX_PREVIEW_DEPLOY_KEY must be a project Preview Deploy Key."
              exit 1
              ;;
          esac

      - name: Create and seed disposable Convex preview
        id: convex-preview
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          E2E_PREVIEW_URL_FILE: ${{ runner.temp }}/convex-e2e-preview-url
        run: |
          preview_name="e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx convex deploy \
            --preview-create "$preview_name" \
            --preview-run seed:seedDisposableE2EPreview \
            --cmd-url-env-var-name VITE_CONVEX_URL \
            --cmd 'printf "%s\n" "$VITE_CONVEX_URL" > "$E2E_PREVIEW_URL_FILE"'

          preview_url="$(tr -d '\r\n' < "$E2E_PREVIEW_URL_FILE")"
          case "$preview_url" in
            https://*.convex.cloud) ;;
            *)
              echo "::error::Convex did not return a valid disposable preview URL."
              exit 1
              ;;
          esac
          printf 'url=%s\n' "$preview_url" >> "$GITHUB_OUTPUT"
          echo "SPA Convex origin: $preview_url"

      - name: Ensure preview Convex Auth issuer keys
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWKS: ${{ secrets.JWKS }}
        run: |
          # Previews inherit production env, not aromatic-okapi-265. If prod lacks the
          # Convex Auth issuer keys, password sign-in hangs on /auth with no toast.
          # Copy JWT_PRIVATE_KEY / JWKS once into the e2e-protected environment from the
          # aromatic dashboard — never Notion aromatic-okapi-265 user passwords.
          has_jwt=0
          has_jwks=0
          while IFS= read -r line; do
            name="${line%%=*}"
            case "$name" in
              JWT_PRIVATE_KEY) has_jwt=1 ;;
              JWKS) has_jwks=1 ;;
            esac
          done < <(npx convex env list --names-only)

          echo "Preview JWT_PRIVATE_KEY present: $has_jwt"
          echo "Preview JWKS present: $has_jwks"

          if [ "$has_jwt" -eq 0 ] || [ "$has_jwks" -eq 0 ]; then
            if [ -z "$JWT_PRIVATE_KEY" ] || [ -z "$JWKS" ]; then
              echo "::error::Disposable preview is missing JWT_PRIVATE_KEY/JWKS and e2e-protected secrets are not set. Copy them from the aromatic Convex dashboard into the e2e-protected environment (not Notion test passwords)."
              exit 1
            fi
            npx convex env set JWT_PRIVATE_KEY "$JWT_PRIVATE_KEY"
            npx convex env set JWKS "$JWKS"
            echo "Set JWT_PRIVATE_KEY and JWKS on the disposable preview (values redacted)."
          fi

      - name: Login smoke (fail fast)
        timeout-minutes: 5
        env:
          VITE_CONVEX_URL: ${{ steps.convex-preview.outputs.url }}
          E2E_ALLOW_MUTATING_SEED: 'true'
          E2E_DISPOSABLE_CONVEX_PREVIEW: 'true'
          E2E_PRESEEDED_CONVEX_PREVIEW: 'true'
          BASE_URL: http://localhost:8080
          CI: true
          VITE_E2E: 'true'
        run: npx playwright test e2e/login-smoke.e2e.ts --reporter=github,list

      - name: Run protected mutating Playwright suite
        env:
          VITE_CONVEX_URL: ${{ steps.convex-preview.outputs.url }}
          E2E_ALLOW_MUTATING_SEED: 'true'
          E2E_DISPOSABLE_CONVEX_PREVIEW: 'true'
          E2E_PRESEEDED_CONVEX_PREVIEW: 'true'
          E2E_ENABLE_DOCUMENT_MUTATIONS: 'true'
          E2E_MUTATE_ENTITLEMENTS: 'true'
          TEST_FILTER: ${{ inputs.test_filter }}
          BASE_URL: http://localhost:8080
          CI: true
          VITE_E2E: 'true'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/playwright.json
        run: |
          mkdir -p test-results
          if [ -n "$TEST_FILTER" ]; then
            npx playwright test --grep "$TEST_FILTER" --reporter=github,json
          else
            npx playwright test --reporter=github,json
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ontology-results-e2e-${{ github.run_id }}
          path: test-results
          retention-days: 14
